<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Campus Lost & Found</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}
  header{background:#1f4e79;color:#fff;padding:14px 20px}
  main{max-width:1050px;margin:auto;padding:16px}
  nav button{padding:8px 16px;margin-right:4px;border:0;background:#cfd8e3;cursor:pointer;font-size:14px}
  nav button.on{background:#1f4e79;color:#fff}
  table{width:100%;border-collapse:collapse;background:#fff;margin-top:10px}
  th,td{padding:7px;border-bottom:1px solid #ddd;text-align:left;font-size:14px}
  th{background:#e8eef5}
  form{background:#fff;padding:12px;margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
  input{padding:7px}
  .btn{padding:7px 12px;border:0;cursor:pointer;color:#fff;background:#1f4e79}
  .del{background:#b3261e}.edit{background:#2e7d32}
</style>
</head>
<body>
<header><h2 style="margin:0">Campus Lost &amp; Found System</h2></header>
<main>
  <nav id="tabs"></nav>
  <input id="q" placeholder="Search this table (e.g. phone, found, library)..." oninput="load()" style="margin-top:10px;width:100%;box-sizing:border-box">
  <form id="f" onsubmit="save(event)"></form>
  <table id="t"></table>
  <h3>Report: items by status</h3>
  <div id="rep"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const FIELDS = {
  users: ['name','email','role','phone'],
  locations: ['name','building','description'],
  items: ['title','category','description','status','dateReported','reportedBy','locationId'],
  claims: ['itemId','claimantId','status','claimDate','proof']
};
const TYPES = { dateReported:'date', claimDate:'date', reportedBy:'number', locationId:'number', itemId:'number', claimantId:'number' };
let col = 'items', editId = null, rows = [];

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const show = (k, v) => TYPES[k] === 'date' && v ? new Date(v).toISOString().slice(0,10) : v;

function drawTabs() {
  $('tabs').innerHTML = Object.keys(FIELDS).map(c =>
    `<button class="${c===col?'on':''}" onclick="col='${c}';editId=null;$('q').value='';drawTabs();load()">${c}</button>`).join('');
}

function drawForm(row = {}) {
  $('f').innerHTML = FIELDS[col].map(k =>
    `<input name="${k}" type="${TYPES[k]||'text'}" placeholder="${k}" value="${esc(show(k,row[k]))}" ${k==='description'||k==='proof'?'':'required'}>`).join('')
    + `<button class="btn">${editId===null?'Add':'Save changes'}</button>`
    + (editId!==null ? `<button type="button" class="btn del" onclick="editId=null;drawForm()">Cancel</button>` : '');
}

async function load() {
  rows = await (await fetch(`/api/${col}?q=${encodeURIComponent($('q').value)}`)).json();
  const keys = ['_id', ...FIELDS[col]];
  $('t').innerHTML = '<tr>' + keys.map(k => `<th>${k}</th>`).join('') + '<th>Actions</th></tr>'
    + rows.map((r,i) => '<tr>' + keys.map(k => `<td>${esc(show(k,r[k]))}</td>`).join('')
      + `<td><button class="btn edit" onclick="edit(${i})">Edit</button> <button class="btn del" onclick="del(${r._id}, this)">Delete</button></td></tr>`).join('');
  drawForm();
  report();
}

async function save(e) {
  e.preventDefault();
  const body = Object.fromEntries(new FormData($('f')));
  const url = editId === null ? `/api/${col}` : `/api/${col}/${editId}`;
  await fetch(url, { method: editId === null ? 'POST' : 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  editId = null; load();
}
function edit(i) { editId = rows[i]._id; drawForm(rows[i]); window.scrollTo(0,0); }
let pending = null;
async function del(id, btn) {
  if (pending !== id) {
    pending = id;
    btn.textContent = 'Click again to confirm';
    setTimeout(() => { if (pending === id) { pending = null; btn.textContent = 'Delete'; } }, 3000);
    return;
  }
  pending = null;
  const r = await fetch(`/api/${col}/${id}`, { method: 'DELETE' });
  if (!r.ok) { btn.textContent = 'Failed'; return; }
  load();
}
async function report() {
  const r = await (await fetch('/api/report/status')).json();
  $('rep').innerHTML = r.map(x => `<b>${esc(x._id)}</b>: ${x.total} &nbsp;&nbsp;`).join('');
}
drawTabs(); load();
</script>
</body>
</html>
